name: Build and Publish Docker Image

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agh_ver:    ${{ steps.extract.outputs.agh_ver }}
      lego_ver:   ${{ steps.extract.outputs.lego_ver }}
      alpine_dig: ${{ steps.extract.outputs.alpine_dig }}
      image_base: ${{ steps.extract.outputs.image_base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract versions from Dockerfile
        id: extract
        env:
          IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          IMAGE_BASE=$(printf '%s\n' "$IMAGE_REPO" | tr '[:upper:]' '[:lower:]')
          AGH_VER=$(sed -nE 's|^FROM adguard/adguardhome:v?([0-9]+\.[0-9]+\.[0-9]+).* AS agh$|\1|p' Dockerfile)
          LEGO_VER=$(sed -nE 's|^FROM goacme/lego:v?([0-9]+\.[0-9]+\.[0-9]+).* AS lego$|\1|p' Dockerfile)
          ALPINE_DIG=$(sed -nE 's|^FROM alpine:[^@]+@sha256:([a-f0-9]{64}).* AS unbound-donor$|\1|p' Dockerfile)

          if [[ ! "$AGH_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'ERROR: invalid or missing AdGuard Home version: %s\n' "$AGH_VER" >&2
            exit 1
          fi

          if [[ ! "$LEGO_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'ERROR: invalid or missing Lego version: %s\n' "$LEGO_VER" >&2
            exit 1
          fi

          if [[ ! "$ALPINE_DIG" =~ ^[a-f0-9]{64}$ ]]; then
            printf 'ERROR: invalid or missing Alpine digest: %s\n' "$ALPINE_DIG" >&2
            exit 1
          fi

          printf 'agh_ver=%s\n' "$AGH_VER" >> "$GITHUB_OUTPUT"
          printf 'lego_ver=%s\n' "$LEGO_VER" >> "$GITHUB_OUTPUT"
          printf 'alpine_dig=%s\n' "$ALPINE_DIG" >> "$GITHUB_OUTPUT"
          printf 'image_base=%s\n' "$IMAGE_BASE" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            push_tag_suffix: -amd64
          - platform: linux/arm64
            push_tag_suffix: -arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ needs.prepare.outputs.image_base }}:${{ needs.prepare.outputs.agh_ver }}${{ matrix.push_tag_suffix }}
          provenance: false
          labels: |
            org.opencontainers.image.title=AdGuard Home + Unbound + Lego
            org.opencontainers.image.description=Hardened AdGuard Home, Unbound DNSSEC recursive resolver, and Lego ACME client on scratch
            org.opencontainers.image.version=${{ needs.prepare.outputs.agh_ver }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            dev.adguardhome.version=${{ needs.prepare.outputs.agh_ver }}
            dev.lego.version=${{ needs.prepare.outputs.lego_ver }}
            dev.alpine.digest=${{ needs.prepare.outputs.alpine_dig }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge:
    name: Merge fat manifests
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        env:
          BASE: ${{ needs.prepare.outputs.image_base }}
          VER: ${{ needs.prepare.outputs.agh_ver }}
        run: |
          docker buildx imagetools create \
            --tag "${BASE}:${VER}" \
            --tag "${BASE}:latest" \
            "${BASE}:${VER}-amd64" \
            "${BASE}:${VER}-arm64"
