name: adguardhome-dev

services:
  adguardhome:
    build:
      context: .
    image: adguardhome-unbound-lego-dev:latest
    container_name: adguardhome-dev
    hostname: adguardhome-dev
    pull_policy: never
    restart: on-failure:3
    user: "${APP_UID}:${APP_GID}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    env_file:
      - .env
    environment:
      - LOG_LEVEL=debug
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 2
    networks:
      frontend_gateway:
        ipv4_address: 172.20.0.253
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:8003:80/tcp"
    volumes:
      - ./data/adguardhome/work:/opt/adguardhome/work:rw,noexec,nosuid,nodev
      - ./data/adguardhome/conf:/opt/adguardhome/conf:rw,noexec,nosuid,nodev
      - ./data/unbound:/opt/unbound:rw,noexec,nosuid,nodev
      - ./data/lego:/opt/lego:rw,noexec,nosuid,nodev
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - /run:mode=1777,size=32m,noexec,nosuid,nodev
      - /tmp:mode=1777,size=8m,noexec,nosuid,nodev
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 200
    mem_reservation: 128M
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # secrets:
    #   - acme_domain
    #   - acme_email
    #   - cf_dns_api_token

# secrets:
#   acme_domain:
#     file: ./secrets/acme_domain
#   acme_email:
#     file: ./secrets/acme_email
#   cf_dns_api_token:
#     file: ./secrets/cf_dns_api_token

networks:
  frontend_gateway:
    external: true
