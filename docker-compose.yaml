name: adguardhome

services:
  adguardhome:
    image: ghcr.io/underhax/adguardhome-unbound-lego:${AGHUL_VERSION:-latest}
    container_name: adguardhome
    hostname: adguardhome
    restart: always
    user: "${APP_UID}:${APP_GID}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      # Required for DHCP server (ports 67/68) or ICMP/ARP client tracking
      # - NET_RAW
    env_file:
      - .env
    networks:
      frontend_gateway:
        ipv4_address: 172.20.0.253
    ports:
      # DNS-over-TLS & DNS-over-QUIC
      - "${HOST_IP:-127.0.0.1}:853:853/tcp"
      - "${HOST_IP:-127.0.0.1}:853:853/udp"
      # Web admin panel (optional direct access without reverse proxy)
      # - "${HOST_BIND_IP:-127.0.0.1}:8002:80/tcp"
      # Plain DNS (alternative port to avoid conflict with systemd-resolved)
      # - "${HOST_BIND_IP:-127.0.0.1}:6553:53/tcp"
      # - "${HOST_BIND_IP:-127.0.0.1}:6553:53/udp"
      # DHCP server (requires NET_RAW)
      # - "${HOST_BIND_IP:-127.0.0.1}:67:67/udp"
      # - "${HOST_BIND_IP:-127.0.0.1}:68:68/tcp"
      # - "${HOST_BIND_IP:-127.0.0.1}:68:68/udp"
      # DNS-over-HTTPS (standalone without reverse proxy)
      # - "${HOST_BIND_IP:-127.0.0.1}:6443:443/tcp"
      # - "${HOST_BIND_IP:-127.0.0.1}:6443:443/udp"
      # DNSCrypt
      # - "${HOST_IP:-127.0.0.1}:5443:5443/tcp"
      # - "${HOST_IP:-127.0.0.1}:5443:5443/udp"
      # pprof profiling endpoint
      # - "${HOST_BIND_IP:-127.0.0.1}:6060:6060/tcp"
    volumes:
      - ./data/adguardhome/work:/opt/adguardhome/work:rw,noexec,nosuid,nodev
      - ./data/adguardhome/conf:/opt/adguardhome/conf:rw,noexec,nosuid,nodev
      - ./data/unbound:/opt/unbound:rw,noexec,nosuid,nodev
      - ./data/lego:/opt/lego:rw,noexec,nosuid,nodev
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - /run:mode=1777,size=32m,noexec,nosuid,nodev
      - /tmp:mode=1777,size=8m,noexec,nosuid,nodev
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 200
    mem_reservation: 128M
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # secrets:
    #   - acme_domain
    #   - acme_email
    #   - cf_dns_api_token

# secrets:
#   acme_domain:
#     file: ./secrets/acme_domain
#   acme_email:
#     file: ./secrets/acme_email
#   cf_dns_api_token:
#     file: ./secrets/cf_dns_api_token

networks:
  frontend_gateway:
    external: true
